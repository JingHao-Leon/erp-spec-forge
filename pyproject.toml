[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-spec-forge"
version = "0.1.0"
description = "Spec-driven design toolkit: describe an ERP in YAML, generate SQL DDL, OpenAPI, RBAC matrix and module registry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JingHao-Leon" }]
keywords = ["erp", "spec-driven", "domain-driven-design", "openapi", "sql", "rbac", "scaffold"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
erp-spec-forge = "erp_spec_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
