components:
  schemas:
    goods_category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        parent_id:
          type: integer
          format: int64
          description: 上级分类，一级分类为空
        level:
          type: integer
          description: 层级 1/2/3
        name:
          type: string
          description: 分类名称
        sort:
          type: integer
          description: 排序号
        created_at:
          type: string
          format: date-time
      required:
      - level
      - name
    unit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 单位名称，如 斤/箱/份
        sort:
          type: integer
      required:
      - name
    tax_rate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 税率名称
        rate:
          type: number
          format: double
          description: 百分比数值
      required:
      - name
      - rate
    goods:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 商品名称
        category_id:
          type: integer
          format: int64
        unit_id:
          type: integer
          format: int64
        tax_rate_id:
          type: integer
          format: int64
          description: 适用税率
        alias:
          type: string
          description: 别名，用于客户下单时匹配
        spec:
          type: string
          description: 规格，如 500g/袋
        status:
          type: string
          enum:
          - normal
          - stopped
          description: 启用状态
        remark:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - name
      - category_id
      - unit_id
    goods_sku:
      type: object
      properties:
        id:
          type: integer
          format: int64
        goods_id:
          type: integer
          format: int64
        sku_name:
          type: string
          description: SKU 名称
        barcode:
          type: string
          description: 条码
        price:
          type: number
          format: double
          description: 参考售价
        status:
          type: string
          enum:
          - normal
          - stopped
      required:
      - goods_id
      - sku_name
    region:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        parent_id:
          type: integer
          format: int64
          description: 上级区域
        sort:
          type: integer
      required:
      - name
    supplier:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
